# Underwater Acoustic LLM Evaluation Configuration
# 3-level hierarchical classification — no parameter estimation, no ablation

# ============================================================
# Taxonomy: L1 → L2 → L3 hierarchical tree
# ============================================================
taxonomy:
  L1:
    name: "Active/Passive"
    description: "Determine whether the signal is actively transmitted or passively received"
    classes:
      - key: active
        name: "Actively transmitted signal"
        aliases: ["actively transmitted", "active", "active signal", "active transmission",
                  "active sonar", "active sonar signal", "active detection",
                  "artificially transmitted", "deliberately emitted", "sonar transmission"]
      - key: passive
        name: "Passively received signal"
        aliases: ["passively received", "passive", "passive signal", "passive reception",
                  "passive listening", "target-radiated", "target-radiated signal",
                  "target-radiated noise", "radiated noise", "passive detection",
                  "ship-radiated", "self-radiated by the source platform"]

  L2:
    name: "Signal Subcategory"
    description: "Further classify within the L1 category"
    classes:
      - key: pulse
        name: "Detection pulse"
        parent: active
        aliases: ["detection pulse", "sonar pulse", "sonar detection pulse",
                  "pulse signal", "detection pulse class", "active sonar pulse"]
      - key: communication
        name: "Communication signal"
        parent: active
        aliases: ["communication", "communication signal", "underwater communication",
                  "digital communication", "underwater acoustic communication",
                  "acoustic communication"]
      - key: ship_noise
        name: "Ship-radiated noise"
        parent: passive
        aliases: ["ship-radiated noise", "ship radiated noise", "vessel-radiated noise",
                  "ship noise", "vessel noise", "radiated noise", "target-radiated noise",
                  "shipping noise"]

  L3:
    name: "Specific Type"
    description: "Finest-grained signal/target type"
    classes:
      # ── Detection pulse ──
      - key: CW
        name: "CW (Continuous Wave)"
        parent: pulse
        aliases: ["CW", "CW pulse", "continuous wave", "CW continuous wave",
                  "single-frequency pulse", "single frequency", "single tone pulse"]
      - key: LFM
        name: "LFM (Linear Frequency Modulation)"
        parent: pulse
        aliases: ["LFM", "LFM pulse", "linear frequency modulation", "linear chirp",
                  "LFM chirp", "linear sweep", "linear FM"]
      - key: HFM
        name: "HFM (Hyperbolic Frequency Modulation)"
        parent: pulse
        aliases: ["HFM", "HFM pulse", "hyperbolic frequency modulation",
                  "hyperbolic chirp", "hyperbolic FM", "hyperbolic sweep",
                  "Doppler-invariant pulse"]

      # ── Communication ──
      - key: 2FSK
        name: "2FSK (Binary Frequency Shift Keying)"
        parent: communication
        aliases: ["2FSK", "binary FSK", "binary frequency shift keying",
                  "2-FSK", "2fsk", "2-level FSK"]
      - key: 4FSK
        name: "4FSK (Quaternary Frequency Shift Keying)"
        parent: communication
        aliases: ["4FSK", "quaternary FSK", "quaternary frequency shift keying",
                  "4-FSK", "4fsk", "4-ary FSK", "4-level FSK"]
      - key: BPSK
        name: "BPSK (Binary Phase Shift Keying)"
        parent: communication
        aliases: ["BPSK", "binary PSK", "binary phase shift keying",
                  "BPSK modulation", "bpsk", "2-PSK"]
      - key: QPSK
        name: "QPSK (Quadrature Phase Shift Keying)"
        parent: communication
        aliases: ["QPSK", "quadrature PSK", "quadrature phase shift keying",
                  "QPSK modulation", "qpsk", "4-PSK"]
      - key: OFDM
        name: "OFDM (Orthogonal Frequency Division Multiplexing)"
        parent: communication
        aliases: ["OFDM", "orthogonal frequency division multiplexing",
                  "OFDM modulation", "ofdm", "multi-carrier modulation"]

      # ── Ship-radiated noise ──
      - key: cargo
        name: "Cargo vessel"
        parent: ship_noise
        aliases: ["cargo vessel", "cargo ship", "cargo", "merchant vessel",
                  "merchant ship", "commercial vessel", "commercial ship",
                  "freighter", "container ship"]
      - key: cruise
        name: "Cruise ship"
        parent: ship_noise
        aliases: ["cruise ship", "cruise", "passenger vessel", "passenger ship",
                  "cruise liner", "ocean liner", "cruise passenger"]
      - key: fishing
        name: "Fishing vessel"
        parent: ship_noise
        aliases: ["fishing vessel", "fishing boat", "fishing", "fisherman boat",
                  "small fishing", "trawler", "commercial fishing"]
      - key: warship
        name: "Naval vessel"
        parent: ship_noise
        aliases: ["naval vessel", "warship", "naval ship", "military vessel",
                  "military ship", "combat vessel", "navy ship", "frigate",
                  "destroyer"]
      - key: underwater_target
        name: "Underwater vehicle"
        parent: ship_noise
        aliases: ["underwater target", "underwater vehicle", "underwater object",
                  "subsurface target", "submerged target", "UUV", "underwater craft",
                  "unmanned underwater vehicle", "underwater drone", "AUV", "submarine"]

# ============================================================
# Evaluation Prompts
# ============================================================
prompts:
  # --- 3-turn dialogue ---
  three_turn:
    turn1:
      - "Determine whether this underwater acoustic signal is actively transmitted or passively received.\nOptions:\nA. Actively transmitted signal\nB. Passively received signal"
      - "Is the signal in this audio deliberately transmitted, or received through passive listening?\nOptions:\nA. Actively transmitted signal\nB. Passively received signal"
      - "First, the most basic question: is this signal active or passive?\nOptions:\nA. Actively transmitted signal\nB. Passively received signal"
    turn2_active:
      - "Good — the signal is {L1}. Now determine whether it is a detection pulse or communication signal, and specify the exact type.\nOptions:\nA. Active — Detection pulse — CW (Continuous Wave)\nB. Active — Detection pulse — LFM (Linear Frequency Modulation)\nC. Active — Detection pulse — HFM (Hyperbolic Frequency Modulation)\nD. Active — Communication — 2FSK (Binary Frequency Shift Keying)\nE. Active — Communication — 4FSK (Quaternary Frequency Shift Keying)\nF. Active — Communication — BPSK (Binary Phase Shift Keying)\nG. Active — Communication — QPSK (Quadrature Phase Shift Keying)\nH. Active — Communication — OFDM (Orthogonal Frequency Division Multiplexing)"
      - "Understood — it is {L1}. Now identify which subcategory it belongs to.\nOptions:\nA. Active — Detection pulse — CW (Continuous Wave)\nB. Active — Detection pulse — LFM (Linear Frequency Modulation)\nC. Active — Detection pulse — HFM (Hyperbolic Frequency Modulation)\nD. Active — Communication — 2FSK (Binary Frequency Shift Keying)\nE. Active — Communication — 4FSK (Quaternary Frequency Shift Keying)\nF. Active — Communication — BPSK (Binary Phase Shift Keying)\nG. Active — Communication — QPSK (Quadrature Phase Shift Keying)\nH. Active — Communication — OFDM (Orthogonal Frequency Division Multiplexing)"
      - "Signal is {L1}. What is its specific signal type?\nOptions:\nA. Active — Detection pulse — CW (Continuous Wave)\nB. Active — Detection pulse — LFM (Linear Frequency Modulation)\nC. Active — Detection pulse — HFM (Hyperbolic Frequency Modulation)\nD. Active — Communication — 2FSK (Binary Frequency Shift Keying)\nE. Active — Communication — 4FSK (Quaternary Frequency Shift Keying)\nF. Active — Communication — BPSK (Binary Phase Shift Keying)\nG. Active — Communication — QPSK (Quadrature Phase Shift Keying)\nH. Active — Communication — OFDM (Orthogonal Frequency Division Multiplexing)"
    turn2_passive:
      - "Good — the signal is {L1}. Identify which type of vessel or underwater vehicle produced this radiated noise.\nOptions:\nA. Passive — Ship-radiated noise — Cargo vessel\nB. Passive — Ship-radiated noise — Cruise ship\nC. Passive — Ship-radiated noise — Fishing vessel\nD. Passive — Ship-radiated noise — Naval vessel\nE. Passive — Ship-radiated noise — Underwater vehicle"
      - "Confirmed as {L1}. Now identify the specific type of noise source.\nOptions:\nA. Passive — Ship-radiated noise — Cargo vessel\nB. Passive — Ship-radiated noise — Cruise ship\nC. Passive — Ship-radiated noise — Fishing vessel\nD. Passive — Ship-radiated noise — Naval vessel\nE. Passive — Ship-radiated noise — Underwater vehicle"
      - "Signal is {L1}. What kind of platform emitted this noise?\nOptions:\nA. Passive — Ship-radiated noise — Cargo vessel\nB. Passive — Ship-radiated noise — Cruise ship\nC. Passive — Ship-radiated noise — Fishing vessel\nD. Passive — Ship-radiated noise — Naval vessel\nE. Passive — Ship-radiated noise — Underwater vehicle"
    turn3: "Please briefly explain your reasoning."

# ============================================================
# Model Configuration
# ============================================================
model:
  # --- Active backend (modify here to switch models) ---
  backend: "qwen2_audio"                    # mock | qwen2_audio | aero1_audio | voxtral_mini | af_next | kimi_audio
  model_id: "/root/autodl-tmp/models/models/Qwen2-Audio-7B-Instruct/snapshots/master"
  device: "cuda:0"                          # or "auto" for multi-GPU
  torch_dtype: "bfloat16"                   # bfloat16 | float16 | float32
  max_new_tokens: 256
  temperature: 0.0                          # 0.0 = greedy decoding

  # --- Default model_id per backend (HuggingFace) ---
  # qwen2_audio:   "Qwen/Qwen2-Audio-7B-Instruct"
  # aero1_audio:   "lmms-lab/Aero-1-Audio"
  # voxtral_mini:  "mistralai/Voxtral-Mini-3B-2507"
  # af_next:       "nvidia/Audio-Flamingo-Next-Instruct"
  # kimi_audio:    "moonshotai/Kimi-Audio-7B-Instruct"

  mock:
    accuracy: 0.85
