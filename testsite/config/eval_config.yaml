# 水声大模型评估配置文件
# 三级层级分类评估 — 不含参数估计，不含消融

# ============================================================
# 分类体系: L1 → L2 → L3 层级树
# ============================================================
taxonomy:
  L1:
    name: "主动/被动"
    description: "判断信号是主动发射还是被动辐射"
    classes:
      - key: active
        name: "主动信号"
        aliases: ["主动", "主动信号", "主动发射", "主动式", "主动声纳", "人为发射"]
      - key: passive
        name: "被动信号"
        aliases: ["被动", "被动信号", "被动接收", "被动式", "目标辐射", "被动监听"]

  L2:
    name: "信号子类"
    description: "在L1方向下进一步划分子类"
    classes:
      - key: pulse
        name: "探测脉冲类"
        parent: active
        aliases: ["探测脉冲类", "脉冲信号", "脉冲", "声纳脉冲"]
      - key: communication
        name: "通信类"
        parent: active
        aliases: ["通信类", "通信信号", "数字通信", "调制信号", "水声通信"]
      - key: ship_noise
        name: "舰船辐射噪声"
        parent: passive
        aliases: ["舰船辐射噪声", "舰船噪声", "船舶噪声", "辐射噪声", "船噪"]

  L3:
    name: "具体类型"
    description: "最细粒度的信号/目标类型"
    classes:
      # ── 探测脉冲类 ──
      - key: CW
        name: "CW连续波"
        parent: pulse
        aliases: ["CW", "CW脉冲", "单频脉冲", "连续波", "单频信号"]
      - key: LFM
        name: "LFM线性调频"
        parent: pulse
        aliases: ["LFM", "LFM脉冲", "线性调频", "chirp", "线性扫频"]
      - key: HFM
        name: "HFM双曲调频"
        parent: pulse
        aliases: ["HFM", "HFM脉冲", "双曲调频", "双曲扫频"]

      # ── 通信类 ──
      - key: 2FSK
        name: "2FSK二进制频移键控"
        parent: communication
        aliases: ["2FSK", "二进制频移键控", "2fsk"]
      - key: 4FSK
        name: "4FSK四进制频移键控"
        parent: communication
        aliases: ["4FSK", "四进制频移键控", "4fsk"]
      - key: BPSK
        name: "BPSK二进制相移键控"
        parent: communication
        aliases: ["BPSK", "二进制相移键控", "bpsk"]
      - key: QPSK
        name: "QPSK四进制相移键控"
        parent: communication
        aliases: ["QPSK", "四进制相移键控", "qpsk"]
      - key: OFDM
        name: "OFDM正交频分复用"
        parent: communication
        aliases: ["OFDM", "正交频分复用", "ofdm"]

      # ── 舰船辐射噪声 ──
      - key: cargo
        name: "货船"
        parent: ship_noise
        aliases: ["货船", "民用货船", "商船", "cargo"]
      - key: cruise
        name: "邮轮"
        parent: ship_noise
        aliases: ["邮轮", "大型邮轮", "游轮", "cruise"]
      - key: fishing
        name: "渔船"
        parent: ship_noise
        aliases: ["渔船", "小型渔船", "fishing", "fishing_boat"]
      - key: warship
        name: "军舰"
        parent: ship_noise
        aliases: ["军舰", "军用舰船", "战舰", "warship"]
      - key: underwater_target
        name: "水下目标"
        parent: ship_noise
        aliases: ["水下目标", "水下航行器", "水下航行体", "underwater_target"]

# ============================================================
# 评估 Prompt 定义
# ============================================================
prompts:
  # --- 三轮对话 (用于 Turn Consistency 测试) ---
  three_turn:
    turn1:
      - "请判断这段水声信号是主动发射的还是被动接收的。\n选项：\nA. 主动信号\nB. 被动信号"
      - "这段音频中的信号是主动声纳发出的，还是被动监听到的？\n选项：\nA. 主动信号\nB. 被动信号"
      - "先判断最基本的问题：这信号是主动式的还是被动式的？\n选项：\nA. 主动信号\nB. 被动信号"
    turn2_active:
      - "好的，{L1}。请进一步判断它是探测脉冲类还是通信类。\n选项：\nA. 主动信号-探测脉冲类-CW连续波\nB. 主动信号-探测脉冲类-LFM线性调频\nC. 主动信号-探测脉冲类-HFM双曲调频\nD. 主动信号-通信类-2FSK\nE. 主动信号-通信类-4FSK\nF. 主动信号-通信类-BPSK\nG. 主动信号-通信类-QPSK\nH. 主动信号-通信类-OFDM"
      - "明白了，{L1}。接下来识别它属于哪个子类。\n选项：\nA. 主动信号-探测脉冲类-CW连续波\nB. 主动信号-探测脉冲类-LFM线性调频\nC. 主动信号-探测脉冲类-HFM双曲调频\nD. 主动信号-通信类-2FSK\nE. 主动信号-通信类-4FSK\nF. 主动信号-通信类-BPSK\nG. 主动信号-通信类-QPSK\nH. 主动信号-通信类-OFDM"
      - "{L1}。那它的具体信号类型是什么？\n选项：\nA. 主动信号-探测脉冲类-CW连续波\nB. 主动信号-探测脉冲类-LFM线性调频\nC. 主动信号-探测脉冲类-HFM双曲调频\nD. 主动信号-通信类-2FSK\nE. 主动信号-通信类-4FSK\nF. 主动信号-通信类-BPSK\nG. 主动信号-通信类-QPSK\nH. 主动信号-通信类-OFDM"
    turn2_passive:
      - "好的，{L1}。请判断这属于哪类舰船或水下目标的辐射噪声。\n选项：\nA. 被动信号-舰船辐射噪声-货船\nB. 被动信号-舰船辐射噪声-邮轮\nC. 被动信号-舰船辐射噪声-渔船\nD. 被动信号-舰船辐射噪声-军舰\nE. 被动信号-舰船辐射噪声-水下目标"
      - "确认是{L1}。接下来识别噪声源的具体类型。\n选项：\nA. 被动信号-舰船辐射噪声-货船\nB. 被动信号-舰船辐射噪声-邮轮\nC. 被动信号-舰船辐射噪声-渔船\nD. 被动信号-舰船辐射噪声-军舰\nE. 被动信号-舰船辐射噪声-水下目标"
      - "{L1}。那它是哪类平台发出的？\n选项：\nA. 被动信号-舰船辐射噪声-货船\nB. 被动信号-舰船辐射噪声-邮轮\nC. 被动信号-舰船辐射噪声-渔船\nD. 被动信号-舰船辐射噪声-军舰\nE. 被动信号-舰船辐射噪声-水下目标"
    turn3: "请简要说明你的判断依据。"

# ============================================================
# 模型配置
# ============================================================
model:
  # --- 当前使用的后端 (修改这里切换模型) ---
  backend: "qwen2_audio"                    # mock | qwen2_audio | aero1_audio | voxtral_mini | af_next | kimi_audio
  model_id: "/root/autodl-tmp/models/models/Qwen2-Audio-7B-Instruct/snapshots/master"
  device: "cuda:0"                          # 或 "auto" 多卡
  torch_dtype: "bfloat16"                   # bfloat16 | float16 | float32
  max_new_tokens: 256
  temperature: 0.0                          # 0.0 = 贪婪解码

  # --- 各模型默认 model_id (HuggingFace) ---
  # qwen2_audio:   "Qwen/Qwen2-Audio-7B-Instruct"
  # aero1_audio:   "lmms-lab/Aero-1-Audio"
  # voxtral_mini:  "mistralai/Voxtral-Mini-3B-2507"
  # af_next:       "nvidia/Audio-Flamingo-Next-Instruct"
  # kimi_audio:    "moonshotai/Kimi-Audio-7B-Instruct"
  # 本地路径示例:   "/root/autodl-tmp/models/models/<model-name>/snapshots/master"

  mock:
    accuracy: 0.85
